<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='styles.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <title>Anyboxd</title>
</head>
<body>
    <header>
        <nav>
            <p id="project">anyboxd</p>
            <p><a id="username" href="#">@kel</a></p>
        </nav>
    </header>
    <main> 
        <section id="hero">
            <h1>Welcome to Anyboxd </h1>
            <p id="list-name"></p>
            <p id="progress"></p>
            <!-- <p>50% completed</p> -->
            <div class="filter-container">
                <button class="filter-button" id="filter-all">all</button>
                <button class="filter-button" id="filter-completed">completed</button>
                <button class="filter-button" id="filter-incomplete">incomplete</button>
            </div>
        </ul>
        <ul class="list">
            <li class="list-item">
                <button class="status">○</button> 
                <div class="item">
                    <p class="item-name">Read The Brothers Karamazov</p>
                    <span class="item-type">Book</span>
                </div>
            </li>
            <li class="list-item">
                <button class="status">✓</button> 
                <div class="item">
                    <p class="item-name">Visit Japan</p>
                    <span class="item-type">Country</span>
                </div>
                <span class="rating">9/10</span>
            </li>
            <li class="list-item">
                <button class="status">○</button> 
                <div class="item">
                    <p class="item-name">Learn To Surf</p>
                    <span class="item-type">Activity</span>
                </div>
            </li>
            <li class="list-item">
                <button class="status">✓</button> 
                <div class="item">
                    <p class="item-name">Visit the Louvre</p>
                    <span class="item-type">Place</span>
                </div>
                <span class="rating">7/10</span>
            </li>
            <li class="list-item">
                <button class="status">✓</button> 
                <div class="item">
                    <p class="item-name">Build a Raspberry Pi Project</p>
                    <span class="item-type">Project</span>
                </div>
                <span class="rating">9/10</span>
            </li>
        </ul>
        <button class="add-item">+ Add Item</button>
        </section>
    </main>
    
    <script src="script.js"></script>

</body>
</html>
